<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started</title>

    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

    <div class="register-box-parent">
    <div class="register-box">
        <h1>Register</h1>
        <form action="#" class="registeration-inputs">
        <label for="username-input-box">Username:</label>
        <input type="text" id="username-input-box" placeholder="Enter your username">

        <label for="password-input-box">Password:</label>
        <input type="password" id="password-input-box" placeholder="Enter your password">
        <button type="submit">Register</button>
        </form>
        <a href="login.html" id="alrdy-acc-link" class="hidden">Already have an account?</a>
    </div>
    </div>
    
</body>
</html>
