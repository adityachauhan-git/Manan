<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="login-box-parent">
    <div class="login-box">
        <h1>Login</h1>
        <form action="#" class="login-inputs">
        <label for="username-input-box">Username:</label>
        <input type="text" id="username-input-box" placeholder="Enter your username">

        <label for="password-input-box">Password:</label>
        <input type="password" id="password-input-box" placeholder="Enter your password">

        <button type="submit">Login</button>

        </form>
        <a href="register.html" id="alrdy-acc-link" class="hidden">Don't have an account?</a>
    </div>
    </div>
    
</body>
</html>
